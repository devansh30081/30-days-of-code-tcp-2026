<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Schedule</title>
</head>
<body>
    
    <h1>Workshop Schedule & Registration</h1>

     <table border="1">
        <thead>
            <tr>
                <th>Time</th>
                <th>Activity</th>
                <th>Venue</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>10:00 AM</td>
                <td>Opening Ceremony</td>
                <td> Hira Hall</td>
            </tr>
            <tr>
                <td>11:30 AM</td>
                <td>Workshop</td>
                <td>CCC Lab</td>
            </tr>
            <tr>
                <td>05:00 PM</td>
                <td>Closing Ceremony</td>
                <td>PPT Hall</td>
            </tr>
        </tbody>
    </table>

    <br><br><br>

    <form action="#" method="post">

    <label for="name"> Name:</label><br>
    <input type="text" id="name" name="name"><br><br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email"><br><br>

    <label for="number">Number:</label><br>
    <input type="number" id="number" name="number"><br><br>

    <label for="date">Date:</label><br>
    <input type="date" id="date" name="date"><br><br>

    <p>Ticket Type:</p>
    <input type="radio" id="Classic" name="ticket" value="Classic">
    <label for="Classic">Classic</label><br>

    <input type="radio" id="Prime" name="ticket" value="Prime">
    <label for="Prime">Prime</label><br>

    <input type="radio" id="Premium" name="ticket" value="Premium">
    <label for="Premium">Premium</label><br><br>

    <p>Workshop Preferences:</p>
    <input type="checkbox" id="html" name="workshop" value="html">
    <label for="html">HTML</label><br>

    <input type="checkbox" id="css" name="workshop" value="css">
    <label for="css">CSS</label><br>

    <input type="checkbox" id="js" name="workshop" value="js">
    <label for="js">JavaScript</label><br><br>

    <label for="comments">Comments/Feedback:</label><br>
    <textarea id="comments" name="comments"></textarea><br><br>

    <button type="submit">Submit</button>

</form>



</body>
</html>
